[package]
name = "sinuous-client"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "0.3.31"
iddqd = "0.5"
rustls = { version = "0.23" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2"
tokio = { version = "1.53.2", features = ["net", "rt", "sync", "time"] }
tokio-tungstenite = {
  version = "0.29.0",
  features = [
    "rustls-tls-native-roots",
  ]
}
tracing = "0.1.44"
url = { version = "2.5.7", features = ["serde"] }

[dev-dependencies]
anyhow = "1.0.100"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
