[package]
name = "sinuous-client"
version = "0.4.0"
edition = "2024"
description = "Unofficial client for controlling Sonos speakers over their local websocket API"
license = "MIT"
repository = "https://github.com/abusch/sinuous-client"
readme = "README.md"
keywords = ["sonos", "speaker", "audio", "websocket", "home-automation"]
categories = ["api-bindings", "multimedia::audio", "network-programming"]

[dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
futures-util = "0.3.31"
iddqd = "0.5"
# Without default features: plain HTTP (UPnP isn't served over TLS), and no system proxy.
reqwest = { version = "0.13.5", default-features = false, optional = true }
roxmltree = { version = "0.21.1", default-features = false, features = ["std"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2"
tokio = { version = "1.53.2", features = ["macros", "net", "rt", "sync", "time"] }
# `__rustls-tls` enables rustls without loading any root certificates: we always pass our own
# `ClientConfig`, which only trusts the Sonos root CA.
tokio-tungstenite = { version = "0.30.0", features = ["__rustls-tls"] }
tracing = "0.1.44"
url = { version = "2.5.7", features = ["serde"] }

[dev-dependencies]
anyhow = "1.0.100"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
tokio = { version = "1.53.2", features = ["io-util", "macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[features]
# Reading a group's queue, which is only available over the players' UPnP interface.
upnp = ["dep:reqwest", "dep:roxmltree"]

[package.metadata.docs.rs]
all-features = true
