[package]
name = "sinuous-client"
version = "0.1.1"
edition = "2024"
description = "Unofficial client for controlling Sonos speakers over their local websocket API"
license = "MIT"
repository = "https://github.com/abusch/sinuous-client"
readme = "README.md"
keywords = ["sonos", "speaker", "audio", "websocket", "home-automation"]
categories = ["api-bindings", "multimedia::audio", "network-programming"]

[dependencies]
futures-util = "0.3.31"
iddqd = "0.5"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2"
tokio = { version = "1.53.2", features = ["net", "rt", "sync", "time"] }
# `__rustls-tls` enables rustls without loading any root certificates: we always pass our own
# `ClientConfig`, which only trusts the Sonos root CA.
tokio-tungstenite = { version = "0.30.0", features = ["__rustls-tls"] }
tracing = "0.1.44"
url = { version = "2.5.7", features = ["serde"] }

[dev-dependencies]
anyhow = "1.0.100"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
