version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    # Conventional commits: `chore(deps): ...` goes in the changelog, `chore(deps-dev): ...`
    # doesn't (see release-plz.toml).
    commit-message:
      prefix: "chore"
      include: "scope"
  # Keep GitHub actions like release-plz up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
